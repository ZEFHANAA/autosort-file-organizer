[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autosort-cli"
version = "1.0.0"
description = "Smart file organizer CLI — sort messy folders (Downloads, Desktop) into categories with dry-run preview and undo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["file-organizer", "cli", "automation", "downloads", "productivity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
autosort = "organizer:main"

[project.urls]
Homepage = "https://github.com/ZEFHANAA/autosort-file-organizer"
Repository = "https://github.com/ZEFHANAA/autosort-file-organizer"
Issues = "https://github.com/ZEFHANAA/autosort-file-organizer/issues"

[tool.setuptools]
py-modules = ["organizer", "config"]
