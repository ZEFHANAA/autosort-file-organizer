# Run the unittest suite on every push and pull request.
# AutoSort is stdlib-only, so no dependency install step is needed.
name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: unittest (Python 3.12, Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall organizer.py config.py tests/

      - name: Run unit tests
        run: python -m unittest tests/test_autosort.py -v
